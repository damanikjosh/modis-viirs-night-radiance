[project]
name = "nightrad"
version = "0.0.1"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Learning VIIRS night radiance from MODIS radiance: code for the paper and the Harmonized VIIRS layer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "torch>=2.4",
  "pyhdf>=0.11",
  "h5py>=3.10",
  "netCDF4>=1.7",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "earthaccess>=0.10",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
